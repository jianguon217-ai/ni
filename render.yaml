services:
  - type: web
    name: mycodex-studio-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MYCODEX_DB_PATH
        value: /tmp/mycodex/jobs.sqlite3
